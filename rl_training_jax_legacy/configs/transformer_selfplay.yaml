# Full self-play config — intended for Kaggle GPU.
# Locally on CPU this will be slow; use smoke_transformer.yaml for iteration.
seed: 0
run_name: jax_ppo_transformer
save_dir: artifacts

env:
  num_envs: 128          # Increased for larger batch size
  episode_steps: 500
  rollout_steps: 32

model:
  d_model: 96
  num_heads: 4
  num_layers: 3
  bucket_count: 4

ppo:
  total_updates: 5000
  epochs: 1              # Set to 1 as per Top 10 solution
  minibatch_size: 1024   # Increased for stability
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  lr_start: 3.0e-5       # Strictly enforced
  lr_end: 1.0e-6
  max_grad_norm: 1.0
  lr_total_updates: 5000

log_every: 5
checkpoint_every: 100
