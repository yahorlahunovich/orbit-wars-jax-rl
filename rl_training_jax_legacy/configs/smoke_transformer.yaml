# Smoke test: 20 updates, small model, small env count.
# Purpose: validate the pipeline end-to-end on CPU. Real training -> Kaggle GPU.
seed: 0
run_name: jax_smoke_transformer
save_dir: artifacts

env:
  num_envs: 8
  episode_steps: 200
  rollout_steps: 16

model:
  d_model: 48
  num_heads: 4
  num_layers: 2
  bucket_count: 4

ppo:
  total_updates: 20
  epochs: 2
  minibatch_size: 256
  gamma: 0.9999
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  lr_start: 1.0e-3
  lr_end: 1.0e-5
  max_grad_norm: 0.5

log_every: 1
checkpoint_every: 20
