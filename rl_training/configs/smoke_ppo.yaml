seed: 321
run_name: smoke_ppo_v2
device: cpu
save_dir: artifacts/rl_current_heuristic_fast
checkpoint_every: 25
log_every: 5
opponent: random
self_play_update_interval: 50
self_play_deterministic: false
alternate_player_sides: true

env:
  episode_steps: 100
  candidate_count: 49
  ship_bucket_count: 5
  use_fast_env: true
  kaggle_env_root: ../analysis/fast_kaggle_env

model:
  hidden_size: 128

ppo:
  rollout_steps: 16
  num_envs: 2
  total_updates: 50
  epochs: 2
  minibatch_size: 128
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  lr: 0.0003
  lr_end: 0.0001
  max_grad_norm: 0.5
