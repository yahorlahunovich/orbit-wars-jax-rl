[project]
name = "orbit-wars-jax"
version = "0.1.0"
description = "JAX-native Orbit Wars RL training (env + policy + PPO)"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "flax>=0.8.0",
    "optax>=0.2.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
