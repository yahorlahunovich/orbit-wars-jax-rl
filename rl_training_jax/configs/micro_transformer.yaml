# Micro-smoke: 3 updates, 4 envs, 8 rollout. Should finish in ~60s on CPU.
seed: 0
run_name: jax_micro_transformer
save_dir: artifacts

env:
  num_envs: 4
  episode_steps: 100
  rollout_steps: 8

model:
  d_model: 32
  num_heads: 2
  num_layers: 1
  bucket_count: 8

ppo:
  total_updates: 3
  epochs: 1
  minibatch_size: 128
  gamma: 0.9999
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  lr_start: 1.0e-3
  lr_end: 1.0e-5
  max_grad_norm: 0.5

log_every: 1
checkpoint_every: 3
