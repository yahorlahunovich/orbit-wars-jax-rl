# Curriculum training: vs kaggle700 heuristic until win-rate threshold, then self-play.
# Using hyperparameters inspired by top-1 Kaggle competitor.
# Intended for Kaggle T4 GPU (may be OOM with 512 envs, reduce if necessary).
seed: 0
run_name: jax_ppo_top1
save_dir: artifacts

env:
  num_envs: 512
  episode_steps: 500
  rollout_steps: 32
  intercept_iterations: 6    # reduce intercept iterations for faster grid build
  enable_planet_block: false # skip planet-block checks for speed

model:
  d_model: 96
  num_heads: 4
  num_layers: 3
  bucket_count: 8

training:
  opponent: curriculum          # selfplay | heuristic | curriculum
  heuristic_win_rate: 0.35      # switch to self-play when rolling win rate >= this
  heuristic_window_episodes: 80 # episodes in rolling window for switch decision
  heuristic_path: null          # null -> versions/kaggle700_current_heuristic/main.py

ppo:
  total_updates: 5000
  epochs: 1                     # ppo_epochs: 1
  minibatch_size: 682           # 512 envs * 32 steps / 24 minibatches ~ 682
  gamma: 0.99                   # gamma_discount: 0.99
  gae_lambda: 0.95              # gae_lambda: 0.95
  clip_coef: 0.2                # clip_eps: 0.2
  ent_coef: 0.05                # ent_coef: 0.05
  vf_coef: 0.5                  # vf_coef: 0.5
  lr_start: 3.0e-5              # learning_rate: 0.00003
  lr_end: 3.0e-5                # Keep flat as no decay was specified
  max_grad_norm: 1.0            # grad_clip: 1
  weight_decay: 0.0001          # weight_decay: 0.0001

log_every: 5
checkpoint_every: 100
