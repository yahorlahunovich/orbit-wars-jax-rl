# Smoke curriculum: 3 updates vs heuristic to validate opponent wiring.
seed: 0
run_name: jax_smoke_curriculum
save_dir: artifacts

env:
  num_envs: 4
  episode_steps: 200
  rollout_steps: 8

model:
  d_model: 48
  num_heads: 4
  num_layers: 2
  bucket_count: 8

training:
  opponent: heuristic
  heuristic_win_rate: 0.99
  heuristic_window_episodes: 20

ppo:
  total_updates: 3
  epochs: 1
  minibatch_size: 64
  gamma: 0.9999
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  lr_start: 1.0e-3
  lr_end: 1.0e-5
  max_grad_norm: 0.5

log_every: 1
checkpoint_every: 3
