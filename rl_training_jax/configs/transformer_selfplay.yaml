# Full self-play config — intended for Kaggle GPU.
# Locally on CPU this will be slow; use smoke_transformer.yaml for iteration.
seed: 0
run_name: jax_ppo_transformer
save_dir: artifacts

env:
  num_envs: 64
  episode_steps: 500
  rollout_steps: 32

model:
  d_model: 96
  num_heads: 4
  num_layers: 3
  bucket_count: 8

ppo:
  total_updates: 5000
  epochs: 3
  minibatch_size: 2048
  gamma: 0.9999
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  lr_start: 1.0e-3
  lr_end: 1.0e-5
  max_grad_norm: 0.5

log_every: 10
checkpoint_every: 100
